name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    # Keep CoreSimulator behavior stable instead of following the rolling
    # macos-latest migration to macOS 26 mid-runner rollout.
    runs-on: macos-15
    env:
      # Safari settings and extension APIs require the iOS 26.2 SDK.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Use Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python validation dependencies
        run: python -m pip install cryptography google-re2

      - name: Install
        run: npm ci

      - name: Test
        env:
          PYIOSBACKUP_PYTHON: python
        run: npm run check

      - name: Test Instagram shared post browser regressions
        timeout-minutes: 3
        shell: bash
        env:
          ELECTRON_ENABLE_LOGGING: "1"
        run: |
          set -euo pipefail
          node_modules/.bin/electron --enable-logging=stderr tests/ios-instagram-shared-reel-browser.cjs 2>&1 | tee "$RUNNER_TEMP/vigil-instagram-browser.log"
          node --input-type=module - "$RUNNER_TEMP/vigil-instagram-browser.log" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          assert.ok(readFileSync(process.argv[2], 'utf8').split(/\r?\n/).includes('VIGIL_INSTAGRAM_SHARED_REEL_BROWSER_COMPLETE'), 'Instagram browser fixture did not complete');
          NODE

      - name: Test Instagram friends and photo browser regressions
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          node_modules/.bin/electron tests/ios-instagram-friends-browser.cjs 2>&1 | tee "$RUNNER_TEMP/vigil-instagram-friends-browser.log"
          node --input-type=module - "$RUNNER_TEMP/vigil-instagram-friends-browser.log" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          assert.ok(readFileSync(process.argv[2], 'utf8').split(/\r?\n/).includes('VIGIL_INSTAGRAM_FRIENDS_BROWSER_COMPLETE'), 'Instagram friends fixture did not complete');
          NODE

      - name: Test block page Back browser regressions
        timeout-minutes: 3
        shell: bash
        env:
          ELECTRON_ENABLE_LOGGING: "1"
        run: |
          set -euo pipefail
          node_modules/.bin/electron --enable-logging=stderr tests/block-page-back-browser.cjs 2>&1 | tee "$RUNNER_TEMP/vigil-block-page-back-browser.log"
          node --input-type=module - "$RUNNER_TEMP/vigil-block-page-back-browser.log" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          assert.ok(readFileSync(process.argv[2], 'utf8').split(/\r?\n/).includes('Real browser Back handles fresh visits, replacement bounces, conservative unverified assign bounces, verified returns, exhausted history, and empty tabs.'), 'Block page Back browser fixture did not complete');
          NODE

      - name: Test packaged browser extension parity
        timeout-minutes: 3
        shell: bash
        env:
          ELECTRON_ENABLE_LOGGING: "1"
        run: |
          set -euo pipefail
          node_modules/.bin/electron --enable-logging=stderr tests/browser-extension-parity-browser.cjs 2>&1 | tee "$RUNNER_TEMP/vigil-browser-extension-parity.log"
          node --input-type=module - "$RUNNER_TEMP/vigil-browser-extension-parity.log" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          assert.ok(readFileSync(process.argv[2], 'utf8').split(/\r?\n/).includes('Packaged Chrome scripts passed Chromium isolated-world startup, keyword actions, ordinary searches, encoded SPA navigation and all-frame domain/POST protection.'), 'Browser extension parity fixture did not complete');
          NODE

      - name: Validate packaged Chrome rule compiler budget and quota
        run: python tests/extension-dnr-budget.py dist/runtime/extension

      - name: Build iOS social app
        # Hosted runners can hang indefinitely while starting CoreSimulator.
        # Compile the real Xcode project here; keep simulator execution local.
        run: node dist/runtime/scripts/build-ios-social-app.mjs instagram --unsigned --destination "generic/platform=iOS" --derived-data /tmp/VigilSocialCIDerivedData

      - name: Compile VigilSocial Swift tests
        env:
          VIGIL_DATA_DIR: ${{ runner.temp }}/vigil-social-ci
        run: |
          vigil_ci_connection=$(node --input-type=module -e 'import { youtubeBuildConfiguration } from "./dist/runtime/scripts/youtube-build-connection.mjs"; console.log(await youtubeBuildConfiguration());')
          xcodebuild -project ios/VigilSocial/VigilSocial.xcodeproj -scheme VigilSocial -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/VigilSocialTestsCIDerivedData "VIGIL_YOUTUBE_CONNECTION_FILE=$vigil_ci_connection" CODE_SIGNING_ALLOWED=NO build-for-testing

      - name: Build Safari extension host and compile Swift tests
        # A generic simulator destination compiles the app, embedded Safari web
        # extension, and test bundle without depending on a bootable CI device.
        run: xcodebuild -project ios/VigilBrowser/VigilBrowser.xcodeproj -scheme VigilBrowser -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/VigilBrowserCIDerivedData CODE_SIGNING_ALLOWED=NO build-for-testing

      - name: Validate Safari extension deployment assets
        run: ios/VigilBrowser/validate.sh

      - name: Build macOS app
        run: npm run package:mac
