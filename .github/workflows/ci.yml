name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    # Keep CoreSimulator behavior stable instead of following the rolling
    # macos-latest migration to macOS 26 mid-runner rollout.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Use Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python validation dependencies
        run: python -m pip install cryptography

      - name: Install
        run: npm ci

      - name: Test
        env:
          PYIOSBACKUP_PYTHON: python
        run: npm run check

      - name: Build iOS social app
        # Hosted runners can hang indefinitely while starting CoreSimulator.
        # Compile the real Xcode project here; keep simulator execution local.
        run: node dist/runtime/scripts/build-ios-social-app.mjs instagram --unsigned --destination "generic/platform=iOS" --derived-data /tmp/SentinelSocialCIDerivedData

      - name: Build macOS app
        run: npm run package:mac
