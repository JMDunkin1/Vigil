name: Signed macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use npm
        run: npm install --global npm@12.2.1 --ignore-scripts
      - name: Use Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Python validation dependencies
        run: python -m pip install --requirement requirements-validation.txt
      - run: npm ci
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - name: Validate
        env:
          PYIOSBACKUP_PYTHON: python
        run: npm run check
      - name: Build, notarize, staple, and checksum
        env:
          VIGIL_MAC_BUILD_VERSION: ${{ github.run_number }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          key_file="$(mktemp "${RUNNER_TEMP}/AuthKey.XXXXXX.p8")"
          cleanup() { rm -f "$key_file"; }
          trap cleanup EXIT
          chmod 600 "$key_file"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_file"
          APPLE_API_KEY="$key_file" npm run release:mac
      - name: Publish release with checksum sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/mac.noindex/*.dmg dist/mac.noindex/release-checksums.json --verify-tag --generate-notes
