name: Signed macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require(\"./package.json\").version')"
      - run: npm run check
      - name: Build, notarize, staple, and checksum
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          key_file="$(mktemp "${RUNNER_TEMP}/AuthKey.XXXXXX.p8")"
          cleanup() { rm -f "$key_file"; }
          trap cleanup EXIT
          chmod 600 "$key_file"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_file"
          APPLE_API_KEY="$key_file" npm run release:mac
      - name: Publish release with checksum sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/mac.noindex/*.dmg dist/mac.noindex/release-checksums.json --verify-tag --generate-notes
