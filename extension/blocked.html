<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blocked · Vigil</title>
  <style>
/* Vigil protection surfaces: neutral surfaces, blue actions, and system typography.
   Keep aligned with public/focused-redesign.css and the server protection pages. */
:root {
  color-scheme: dark;
  --paper: #101216;
  --paper-2: #14171d;
  --ink: #f4f6fa;
  --muted: #a4adb8;
  --primary: #315ae8;
  --primary-strong: #244bc9;
  --blue: #89abff;
  --line: rgba(210, 220, 240, .14);
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  -webkit-text-size-adjust: 100%;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: max(40px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
  background:
    radial-gradient(circle at 78% -8%, rgba(49, 90, 232, .10), transparent 34rem),
    linear-gradient(180deg, var(--paper), var(--paper-2));
}
main { width: min(560px, 100%); }
.brand-lockup { display: flex; align-items: center; gap: 12px; margin-bottom: 36px; }
.brand-mark { display: block; width: 44px; height: 44px; flex: 0 0 auto; }
.eyebrow { margin: 0; color: var(--blue); font-size: .72rem; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
h1 {
  max-width: 16ch;
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(2.5rem, 5vw, 3.75rem);
  font-weight: 600;
  line-height: 1.08;
  letter-spacing: -.025em;
  overflow-wrap: anywhere;
  text-wrap: balance;
}
.message, .reason {
  max-width: 46ch;
  margin: 22px 0 0;
  color: var(--muted);
  font-size: 1rem;
  line-height: 1.65;
  overflow-wrap: anywhere;
}
.escape-actions { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line); }
.escape-actions a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  min-height: 48px;
  padding: 12px 20px;
  border: 1px solid transparent;
  border-radius: 9px;
  background: var(--primary);
  color: #ffffff;
  font-size: .94rem;
  font-weight: 700;
  line-height: 1.4;
  text-decoration: none;
  transition: background .15s ease, transform .15s ease;
}
.escape-actions a:hover { background: var(--primary-strong); }
.escape-actions a:active { transform: translateY(1px); }
.escape-actions a:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
strong { color: var(--ink); }
@media (max-width: 520px) {
  .brand-lockup { margin-bottom: 28px; }
  .escape-actions a { width: 100%; justify-content: space-between; }
}
@media (prefers-reduced-motion: reduce) {
  .escape-actions a { transition: none; }
}

@media (prefers-color-scheme: light) {
  :root { color-scheme: light; --paper: #f5f6f8; --paper-2: #edf0f5; --surface: #ffffff; --ink: #1a1f2a; --muted: #596575; --line: #dde2ea; --line-strong: #bdc6d4; --primary: #315ae8; --primary-strong: #244bc9; --blue: #315ae8; --focus: #e9efff; }
}
</style>
</head>
<body data-vigil-block-page="1">
  <main>
    <div class="brand-lockup">
      <img class="brand-mark" src="icons/icon-128.png" width="44" height="44" alt="">
      <p class="eyebrow">Vigil</p>
    </div>
    <h1>This search is blocked.</h1>
    <p class="message">Explicit sexual content is not allowed, regardless of age.<br>Go back, or close this tab.</p>
    <div class="escape-actions">
      <a id="leaveBlockedPage" href="about:blank">Go back</a>
    </div>
  </main>
  <script src="blocked-navigation.js"></script>
</body>
</html>
