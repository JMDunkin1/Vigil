<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vigil Companion Options</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17201d;
      --muted: #5c6762;
      --line: #d4cec0;
      --paper: #f6f1e8;
      --surface: #fffcf4;
      --primary: #126a6f;
    }

    body {
      margin: 0;
      min-width: 360px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--paper);
      color: var(--ink);
    }

    main {
      box-sizing: border-box;
      max-width: 560px;
      padding: 24px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 1.35rem;
      letter-spacing: 0;
    }

    form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      font-weight: 800;
    }

    span {
      font-size: 0.9rem;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    button {
      min-height: 40px;
      border: 0;
      border-radius: 6px;
      padding: 0 14px;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    button[type="submit"] {
      background: var(--primary);
      color: #fffdf6;
    }

    button[type="button"] {
      background: #ded8ca;
      color: var(--ink);
    }

    [role="status"] {
      min-height: 1.3em;
      margin: 0;
      color: var(--muted);
      font-weight: 750;
    }
  </style>
</head>
<body>
  <main>
    <h1>Vigil Companion</h1>
    <form id="settings">
      <label>
        <span>Local server URL</span>
        <input id="localServer" name="localServer" placeholder="http://127.0.0.1:8787" autocomplete="off">
      </label>
      <label>
        <span>Extension token</span>
        <input id="extensionToken" name="extensionToken" type="password" autocomplete="off">
      </label>
      <label>
        <span>Extension origin</span>
        <input id="extensionOrigin" name="extensionOrigin" readonly>
      </label>
      <div class="actions">
        <button type="submit">Save</button>
        <button type="button" id="testConnection">Test</button>
      </div>
      <p id="status" role="status"></p>
    </form>
  </main>
  <script src="options.js"></script>
</body>
</html>
