<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vigil Companion Options</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #101216;
      --paper-2: #14171d;
      --surface: #22262e;
      --ink: #f4f6fa;
      --muted: #a4adb8;
      --line: #30343d;
      --line-strong: #485265;
      --primary: #315ae8;
      --primary-strong: #244bc9;
  --blue: #89abff;
      --focus: rgba(137, 171, 255, .24);
    }

    body {
      margin: 0;
      min-width: 280px;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 78% -8%, rgba(49, 90, 232, .08), transparent 34rem),
        linear-gradient(180deg, var(--paper), var(--paper-2));
      color: var(--ink);
    }

    main {
      box-sizing: border-box;
      max-width: 560px;
      padding: 32px;
    }

    h1 {
      margin: 0 0 24px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -.035em;
    }

    form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      font-weight: 800;
    }

    span {
      font-size: 0.9rem;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      padding: 0 12px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
    }
    input:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    button {
      min-height: 40px;
      border: 1px solid transparent;
      border-radius: 9px;
      padding: 0 14px;
      font: inherit;
      font-weight: 760;
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }
    button:hover { transform: translateY(-1px); }

    button[type="submit"] {
      background: var(--primary);
      color: #ffffff;
    }
    button[type="submit"]:hover { background: var(--primary-strong); }

    button[type="button"] {
      border-color: var(--line-strong);
      background: var(--surface);
      color: var(--ink);
    }

    [role="status"] {
      min-height: 1.3em;
      margin: 0;
      color: var(--muted);
      font-weight: 750;
    }

    .diagnostics {
      display: grid;
      gap: 8px;
      margin-top: 4px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .diagnostic-row {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      font-size: 0.9rem;
    }

    .diagnostic-row strong {
      font-size: 0.78rem;
      text-transform: uppercase;
      color: var(--muted);
    }

    code {
      display: block;
      overflow-wrap: anywhere;
      border: 1px dashed var(--line);
      border-radius: 9px;
      padding: 8px 10px;
      background: var(--surface);
      color: var(--ink);
      font-size: 0.82rem;
      line-height: 1.35;
    }

@media (prefers-color-scheme: light) {
  :root { color-scheme: light; --paper: #f5f6f8; --paper-2: #edf0f5; --surface: #ffffff; --ink: #1a1f2a; --muted: #596575; --line: #dde2ea; --line-strong: #bdc6d4; --primary: #315ae8; --primary-strong: #244bc9; --blue: #315ae8; --focus: #e9efff; }
}
</style>
</head>
<body>
  <main>
    <img src="icons/icon-128.png" width="44" height="44" alt="" style="display:block;margin-bottom:24px">
    <h1>Vigil Companion</h1>
    <form id="settings">
      <label>
        <span>Local server URL</span>
        <input id="localServer" name="localServer" placeholder="http://127.0.0.1:8787" autocomplete="off">
      </label>
      <label>
        <span>Extension token</span>
        <input id="extensionToken" name="extensionToken" type="password" autocomplete="off">
      </label>
      <label>
        <span>Extension origin</span>
        <input id="extensionOrigin" name="extensionOrigin" readonly>
      </label>
      <div class="actions">
        <button type="submit">Save</button>
        <button type="button" id="testConnection">Test</button>
        <button type="button" id="copyPairingEnv">Copy ID Env</button>
      </div>
      <div class="diagnostics" aria-live="polite">
        <div class="diagnostic-row">
          <strong>Server</strong>
          <span id="serverCheck">Not checked</span>
        </div>
        <div class="diagnostic-row">
          <strong>Pairing</strong>
          <span id="pairingCheck">Not checked</span>
        </div>
        <div class="diagnostic-row">
          <strong>Server env</strong>
          <code id="pairingEnvHint"></code>
        </div>
      </div>
      <p id="status" role="status"></p>
    </form>
  </main>
  <script src="options.js"></script>
</body>
</html>
